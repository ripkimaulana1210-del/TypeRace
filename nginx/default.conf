server {
    listen 80;
    server_name localhost;

    # Mendukung transmisi model 3D besar (Mclaren.glb 72MB, track.glb 25MB)
    client_max_body_size 100M;

    # Gzip Compression untuk mempercepat loading file statis
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Konfigurasi Header untuk WebSocket (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout koneksi agar koneksi real-time Socket.IO stabil
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
