services:
  web1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_ORIGIN=*
      # Koneksi ke CT 102 (Database PostgreSQL). Ganti IP dengan IP CT 102 Anda jika berbeda
      - DATABASE_URL=postgres://typerace_user:typerace_password@192.168.44.132:5432/typerace_db
    ports:
      # Port 8080 host dipetakan ke port 3000 aplikasi TypeRace
      - "8080:3000"
    volumes:
      - ./public:/app/public
      - ./server.js:/app/server.js
      - ./db.js:/app/db.js

